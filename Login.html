<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sake D. Binks - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/Login.css">
</head>
<body>

    <div class="login-card">
        <h2>Sake D. Binks</h2>
        <form id="form-login">
            <div class="form-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" placeholder="ejemplo@duoc.cl" required>
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" placeholder="Entre 4 y 10 caracteres" required>
            </div>
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <!-- Script de autenticación vinculado -->
    <script src="js/Login.js"></script>
</body>
</html>
