<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proceder al pago | SAKE D. BINKS</title>
    <link rel="stylesheet" href="css/paginas.css">
    <style>
        .checkout-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; }
        .checkout-panel { border-top: 1px solid #000; padding-top: 24px; }
        .checkout-panel label { display: block; margin: 0 0 8px; font-size: .75rem; letter-spacing: 1px; text-transform: uppercase; }
        .checkout-panel input { width: 100%; border: 1px solid #ccc; padding: 13px; margin-bottom: 20px; font: inherit; }
        .checkout-panel input[readonly] { background: #f5f5f5; color: #555; }
        .checkout-panel select { width: 100%; border: 1px solid #ccc; padding: 13px; margin-bottom: 20px; font: inherit; background: #fff; }
        .checkout-panel select { width: 100%; border: 1px solid #ccc; padding: 13px; margin-bottom: 20px; font: inherit; background: #fff; }
        .saved-data { margin: 0 0 24px; color: #666; font-size: .9rem; line-height: 1.5; }
        .checkout-button { width: 100%; padding: 15px; border: 0; background: #000; color: #fff; letter-spacing: 1px; cursor: pointer; }
        .checkout-summary { border-top: 1px solid #000; padding-top: 24px; }
        .checkout-summary p { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 12px 0; }
        .checkout-message { margin-top: 18px; line-height: 1.5; }
        @media (max-width: 700px) { .checkout-layout { grid-template-columns: 1fr; gap: 42px; } .site-header { padding: 20px; } }
    </style>
</head>
<body>
    <header class="site-header"><a class="site-logo" href="Inicio.html">SAKE D. BINKS</a><nav class="site-nav"><a href="carrito.html">Volver a la cesta</a></nav></header>
    <main class="page-shell">
        <span class="eyebrow">Checkout</span>
        <h1>Proceder al pago.</h1>
        <div class="checkout-layout">
            <form class="checkout-panel" id="checkout-form" novalidate>
                <div id="customer-fields">
                    <p class="saved-data" id="saved-user-message" hidden>Datos de tu cuenta</p>
                    <label for="checkout-name">Nombre</label><input id="checkout-name" required autocomplete="name">
                    <label for="checkout-email">Correo</label><input id="checkout-email" type="email" required autocomplete="email">
                </div>
                <label for="address-choice">Dirección de entrega</label>
                <select id="address-choice" aria-label="Elegir dirección de entrega"></select>
                <input id="checkout-address" required autocomplete="street-address" placeholder="Tu dirección de entrega" hidden>
                <p class="saved-data" id="address-message">La dirección se guardará para tu próxima compra.</p>
                <label for="card-choice">Tarjeta</label>
                <select id="card-choice" aria-label="Elegir tarjeta"></select>
                <input id="checkout-card" inputmode="numeric" minlength="12" maxlength="19" placeholder="1111 2222 3333 4444" required hidden>
                <button class="checkout-button" type="submit" style="margin-top:22px">CONFIRMAR PEDIDO</button>
                <p class="checkout-message" id="checkout-message" role="status"></p>
            </form>
            <section class="checkout-summary"><h2>Resumen</h2><div id="checkout-items"></div><p><strong>Total</strong><strong id="checkout-total">$0 CLP</strong></p></section>
        </div>
    </main>
    <script src="js/checkout.js"></script>
</body>
</html>
